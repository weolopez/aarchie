<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <title>Aarchie</title>
    <link rel="stylesheet" href="/www/styles.css">
</head>
<body>

    <div id="app">
        <header>
            <button id="sidebar-toggle">
                <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
                    <rect y="0" width="18" height="1.5" rx="0.75" fill="currentColor"/>
                    <rect y="6" width="18" height="1.5" rx="0.75" fill="currentColor"/>
                    <rect y="12" width="18" height="1.5" rx="0.75" fill="currentColor"/>
                </svg>
            </button>
            <span class="header-title">Aarchie</span>
        </header>

        <conversation-sidebar></conversation-sidebar>
        <div id="chat-container">
            <!-- Messages will be injected here by app.js -->
        </div>

        <typing-indicator></typing-indicator>
        <chat-input></chat-input>
    </div>

    <script type="module" src="/www/app.js"></script>
</body>
</html>
